     <script>
        let a=3;

//arrow function:

//function with parameters:

//demonstrate global vs local scope:        


        var foodcatering="madhampatti rangaraj";
    console.log(foodcatering);

    function reception(){
        console.log(foodcatering + "CheckGlobal value"); //checks the global value
    }

    function wedding(){

    //console.log(music); // this variable defined inside funct so its not print
    wedding();


    {
        var colour="red";

        console.log(colour);
        console.log(colorcode);


        
    }
    console.log(colour);// it is (var) called outside
    


//callback function:


    function greet(name){
        console.log('Hello,${name!}');

    }
    function processUser(callback){
        const name="Alice";
        callback(name);
    }
    processUser(greet);



//closure Function:
     
 
    function outer() {
        let outerVar = "I'm in the outer scope!";
        function inner() {
            console.log(outerVar);
            outerVar = "Updated";
        }
        return inner;
    }

const closureFn = outer();
closureFn(); // I'm in the outer scope!
closureFn(); // Updated
        


     </script>
